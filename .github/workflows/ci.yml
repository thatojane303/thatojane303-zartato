name: CI - Compile & Test ZarTATO
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Compile
        run: npx hardhat compile --force
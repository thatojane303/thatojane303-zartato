name: Deploy to Sepolia
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npx hardhat compile
        env:
          SEPOLIA_RPC: ${{ secrets.SEPOLIA_RPC }}

      - name: Deploy to Sepolia
        run: npx hardhat run scripts/deploy.js --network sepolia
        env:
          SEPOLIA_RPC: ${{ secrets.SEPOLIA_RPC }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          FUNCTIONS_ROUTER: ${{ secrets.FUNCTIONS_ROUTER }}

      - name: Save deployment artifact
        if: always()
        run: |
          if [ -f deployment.json ]; then
            echo "deployment.json exists"
            cat deployment.json
          else
            echo "No deployment.json produced"
          fi

      - name: Verify contracts on Etherscan (optional)
        if: ${{ secrets.ETHERSCAN_API_KEY != '' }}
        run: |
          if [ ! -f deployment.json ]; then
            echo "deployment.json not found — skipping verification"
            exit 0
          fi
          TOKEN_ADDR=$(jq -r .token deployment.json)
          ORACLE_ADDR=$(jq -r .oracle deployment.json)
          DEPLOYER=$(jq -r .deployer deployment.json)
          echo "Verifying Token at $TOKEN_ADDR"
          npx hardhat verify --network sepolia $TOKEN_ADDR "$DEPLOYER"
          echo "Verifying Oracle at $ORACLE_ADDR"
          npx hardhat verify --network sepolia $ORACLE_ADDR "$DEPLOYER" "$FUNCTIONS_ROUTER"
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          SEPOLIA_RPC: ${{ secrets.SEPOLIA_RPC }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          FUNCTIONS_ROUTER: ${{ secrets.FUNCTIONS_ROUTER }}

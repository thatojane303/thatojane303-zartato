name: CI - Compile & Test ZarTATO
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        registry-url: 'https://registry.npmjs.org'
    - run: rm -rf node_modules package-lock.json
    - run: npm cache clean --force
    - run: npm install --no-audit --no-fund --legacy-peer-deps
    - run: npx hardhat compile
      env:
        # NEVER hardcode private keys in workflows
        # Use GitHub Secrets instead: Settings → Secrets and variables → Actions
        # For testing compile only, PRIVATE_KEY can be empty or use a test key from secrets
        PRIVATE_KEY: ${{ secrets.PRIVATE_KEY || '' }}
        BASE_MAINNET_RPC: https://mainnet.base.org
        BASE_SEPOLIA_RPC: https://sepolia.base.org
    - run: npx hardhat test
  
  # Certora formal verification (optional, disabled by default)
  certora-check:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "skipped"

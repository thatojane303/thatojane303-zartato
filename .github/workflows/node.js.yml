name: CI - Compile & Test ZarTATO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm cache clean --force
    - run: npm install
    - run: npx hardhat compile
    - run: npx hardhat test || echo "no tests yet"

  certora-check:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "certora disabled without key"
